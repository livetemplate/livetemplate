name: Performance Benchmarks

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read
  pull-requests: write  # For posting comments

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Need history for baseline

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Install benchstat
      # Pinned: the gate parses benchstat's CSV output, and @latest could
      # change the format under us.
      run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260709024250-82a0b07e230d

    - name: Run benchmarks
      run: |
        # bench-ci = every benchmark except the capacity-planning sweeps
        # (high-N fan-out, huge histories/docs — informational only; the
        # excluded set is defined once, in the Makefile). COUNT=3 gives
        # benchstat a median for the posted tables; the gated metrics
        # (B/op, allocs/op) are deterministic and need no repetition.
        make bench-ci COUNT=3 > current-bench.txt || true
        cat current-bench.txt

    - name: Compare against baseline
      id: compare
      run: |
        if [ -f testdata/benchmarks/baseline.txt ]; then
          benchstat testdata/benchmarks/baseline.txt current-bench.txt > comparison.txt || true
          benchstat -format csv testdata/benchmarks/baseline.txt current-bench.txt > comparison.csv 2>/dev/null || true
          echo "comparison<<EOF" >> $GITHUB_OUTPUT
          cat comparison.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        else
          echo "No baseline found - this is the first benchmark run"
          echo "comparison=No baseline found. Save these results as baseline." >> $GITHUB_OUTPUT
        fi
      continue-on-error: true

    - name: Check for regressions
      id: regression-check
      run: |
        if [ -f comparison.csv ]; then
          # Gates on B/op and allocs/op (machine-independent) for the critical
          # families; computes deltas from benchstat's medians itself because
          # benchstat marks low-sample deltas "~" — the old grep gate passed
          # vacuously on exactly that. Fails closed if it parses no rows.
          python3 scripts/bench_gate.py comparison.csv | tee gate-output.txt || true
          if ! grep -E '^(status|message)=' gate-output.txt >> $GITHUB_OUTPUT; then
            # The gate script crashed before emitting a verdict — that is a
            # broken gate, not a green build. Fail closed.
            echo "status=fail" >> $GITHUB_OUTPUT
            echo "message=bench_gate.py produced no verdict (script crash) — failing closed" >> $GITHUB_OUTPUT
          fi
        else
          echo "status=skip" >> $GITHUB_OUTPUT
          echo "message=No baseline comparison available" >> $GITHUB_OUTPUT
        fi
      continue-on-error: true

    - name: Post comparison comment
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      env:
        # Passed via env, not ${{ }} interpolation inside the script:
        # comparison/message embed benchmark names, which PR code controls —
        # textual interpolation into the JS would be script injection.
        COMPARISON: ${{ steps.compare.outputs.comparison }}
        GATE_STATUS: ${{ steps.regression-check.outputs.status }}
        GATE_MESSAGE: ${{ steps.regression-check.outputs.message }}
      with:
        script: |
          const comparison = process.env.COMPARISON;
          const status = process.env.GATE_STATUS;
          const message = process.env.GATE_MESSAGE;

          let statusIcon = '✅';
          if (status === 'fail') statusIcon = '❌';
          else if (status === 'warn') statusIcon = '⚠️';
          else if (status === 'skip') statusIcon = 'ℹ️';

          const body = `## ${statusIcon} Performance Benchmark Results\n\n` +
            `**Status:** ${message}\n\n` +
            `<details>\n<summary>Benchmark Comparison</summary>\n\n\`\`\`\n${comparison}\n\`\`\`\n\n</details>\n\n` +
            `### Gate\n\n` +
            `- Gated metrics: **B/op and allocs/op** (machine-independent; sec/op is informational — the committed baseline is from a different machine)\n` +
            `- ⚠️ Warning: >10% allocation regression on critical benchmarks · ❌ Failure: >20%\n` +
            `- Critical families: \`E2E|Template|CompareTrees|RangeDiff|PrepareTree|Composite|TopicFanout|TriggerAction|Upload_|Redis|ChatAppend|WideTable|LargeDoc\` excluding \`Loopback|EnqueueOnly|RealRedis\` variants (authoritative list: \`scripts/bench_gate.py\`)\n` +
            `- Capacity sweeps (enumerated in the Makefile's \`BENCH_SKIP_CAPACITY\`: N/hist ∈ {1000, 10000}, peers=1000, files ∈ {50, 100}) are excluded from CI runs entirely — see \`make bench-ci\`\n\n` +
            `See [benchmarking guide](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/${context.payload.pull_request.head.ref}/docs/performance/benchmarking-guide.md) for details.`;

          // Find existing benchmark comment
          const { data: comments } = await github.rest.issues.listComments({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo
          });

          const existingComment = comments.find(c =>
            c.user.login === 'github-actions[bot]' &&
            c.body.includes('Performance Benchmark Results')
          );

          if (existingComment) {
            // Update existing comment
            await github.rest.issues.updateComment({
              comment_id: existingComment.id,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
          } else {
            // Create new comment
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
          }

    - name: Upload benchmark results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: |
          current-bench.txt
          comparison.txt
          comparison.csv
          gate-output.txt
        retention-days: 30

    - name: Fail if critical regression
      if: steps.regression-check.outputs.status == 'fail'
      env:
        GATE_MESSAGE: ${{ steps.regression-check.outputs.message }}
      run: |
        echo "::error::${GATE_MESSAGE}"
        exit 1
