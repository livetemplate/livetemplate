name: Tests

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Download dependencies
      run: go mod download

    - name: Run unit tests
      run: |
        # Run non-fuzz tests with race detector
        # Fuzz/property tests run in parallel job without race detector
        go test -v -race -timeout=300s -skip '^(TestFuzz|Fuzz)' $(go list ./... | grep -v '/cmd/lvt' | grep -v '/examples' | grep -v '/client')
      env:
        CGO_ENABLED: 1

    - name: Build
      run: |
        go build -v $(go list ./... | grep -v '/cmd/lvt' | grep -v '/examples' | grep -v '/client')

  fuzz-tests:
    name: Fuzz Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Download dependencies
      run: go mod download

    - name: Run fuzz tests
      run: |
        # Property-based tests: no race detector (tests algorithmic correctness, not concurrency)
        # Reduced iterations (50 vs default 100) — rapid's shrinking still catches bugs effectively
        go test -v -timeout=300s -run '^(TestFuzz|Fuzz)' -rapid.checks=50 $(go list ./... | grep -v '/cmd/lvt' | grep -v '/examples' | grep -v '/client')
      env:
        CGO_ENABLED: 1

  release-script-tests:
    name: Release Script Tests
    runs-on: ubuntu-latest

    # Pure-bash unit tests for release.sh's changelog promotion and client-pin
    # guard. They source release.sh with RELEASE_SH_LIB=1, run in a temp dir, and
    # need no Go build or network — release.sh is only exercised during a release,
    # so these move regression discovery from release time onto every PR.
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Test release.sh changelog handling
      run: bash scripts/test_release_changelog.sh

    - name: Test release.sh client-pin guard
      run: bash scripts/test_release_client_pin.sh
