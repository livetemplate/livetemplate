name: Cross-Repository Tests

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'

jobs:
  test-lvt:
    name: Test LVT against Core Changes
    runs-on: ubuntu-latest

    steps:
    - name: Checkout core library (this PR/branch)
      uses: actions/checkout@v4
      with:
        path: livetemplate

    - name: Checkout LVT
      uses: actions/checkout@v4
      with:
        repository: livetemplate/lvt
        path: lvt

    - name: Checkout client library
      uses: actions/checkout@v4
      with:
        repository: livetemplate/client
        path: livetemplate/client

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Install sqlc
      run: |
        go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.28.0
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: livetemplate/client/package-lock.json

    - name: Build client library
      working-directory: livetemplate/client
      run: |
        echo "Installing client dependencies..."
        npm ci
        echo "Building client library..."
        npm run build
        echo "OK: Client library built successfully"
        ls -la dist/

    - name: Run core library unit tests (with race detector)
      working-directory: livetemplate
      run: |
        echo "Running core library unit tests..."
        go test -v -race -timeout=300s -skip '^(TestFuzz|Fuzz)' ./...
      env:
        CGO_ENABLED: 1
        LIVETEMPLATE_CLIENT_DIR: ${{ github.workspace }}/livetemplate/client

    - name: Run core library fuzz tests (property-based)
      working-directory: livetemplate
      run: |
        echo "Running core library fuzz/property tests with TypeScript oracle..."
        go test -v -timeout=300s -run '^(TestFuzz|Fuzz)' -rapid.checks=50 ./...
      env:
        CGO_ENABLED: 1
        LIVETEMPLATE_CLIENT_DIR: ${{ github.workspace }}/livetemplate/client

    - name: Add replace directive to LVT
      working-directory: lvt
      run: |
        echo "Adding replace directive to use local core library..."
        go mod edit -replace=github.com/livetemplate/livetemplate=../livetemplate
        go mod tidy
        echo "OK: Replace directive added"

    - name: Run LVT unit tests
      working-directory: lvt
      run: go test -v -race -timeout=10m ./...
      env:
        CGO_ENABLED: 1
        # LIVETEMPLATE_LOCAL_PATH enables integration tests to add replace directives
        # to generated apps, ensuring they use local livetemplate instead of released version
        LIVETEMPLATE_LOCAL_PATH: ${{ github.workspace }}/livetemplate

    - name: Run LVT browser E2E tests
      working-directory: lvt
      run: go test -v -race -timeout=15m -tags=browser ./...
      env:
        CGO_ENABLED: 1
        LIVETEMPLATE_LOCAL_PATH: ${{ github.workspace }}/livetemplate

  test-examples:
    name: Test Examples against Core Changes
    runs-on: ubuntu-latest

    steps:
    - name: Checkout core library (this PR/branch)
      uses: actions/checkout@v4
      with:
        path: livetemplate

    - name: Checkout LVT (for testing package)
      uses: actions/checkout@v4
      with:
        repository: livetemplate/lvt
        path: lvt

    - name: Checkout examples
      uses: actions/checkout@v4
      with:
        repository: livetemplate/examples
        path: examples

    - name: Checkout client library
      uses: actions/checkout@v4
      with:
        repository: livetemplate/client
        path: livetemplate/client

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: livetemplate/client/package-lock.json

    - name: Build client library
      working-directory: livetemplate/client
      run: |
        echo "Installing client dependencies..."
        npm ci
        echo "Building client library..."
        npm run build
        echo "OK: Client library built successfully"
        ls -la dist/

    - name: Install sqlc
      run: |
        go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.28.0
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

    - name: Add replace directives to examples
      working-directory: examples
      run: |
        echo "Adding replace directives to examples monorepo..."
        go mod edit -replace=github.com/livetemplate/livetemplate=../livetemplate
        go mod edit -replace=github.com/livetemplate/lvt/components=../lvt/components
        go mod tidy
        echo "OK: Replace directives added"

    - name: Run examples test suite
      working-directory: examples
      run: ./test-all.sh --skip-disabled
      env:
        CGO_ENABLED: 1
        LVT_LOCAL_CLIENT: ${{ github.workspace }}/livetemplate/client/dist/livetemplate-client.browser.js

  # The patterns app (formerly examples/patterns) was folded into the
  # docs repo at content/recipes/patterns/_app/ with its tests
  # relocated to docs/e2e/patterns/. This job preserves the
  # "patterns runs against core changes" coverage that test-examples
  # provided before the deletion.
  test-docs:
    name: Test Docs Patterns against Core Changes
    runs-on: ubuntu-latest

    steps:
    - name: Checkout core library (this PR/branch)
      uses: actions/checkout@v4
      with:
        path: livetemplate

    - name: Checkout LVT (for testing package)
      uses: actions/checkout@v4
      with:
        repository: livetemplate/lvt
        path: lvt

    - name: Checkout docs
      uses: actions/checkout@v4
      with:
        repository: livetemplate/docs
        path: docs

    - name: Use matching docs branch if available
      working-directory: docs
      env:
        DOCS_REF: ${{ github.head_ref || github.ref_name }}
      run: |
        if git ls-remote --exit-code --heads origin "$DOCS_REF" >/dev/null 2>&1; then
          echo "Using livetemplate/docs branch: $DOCS_REF"
          git fetch origin "$DOCS_REF" --depth=1
          git checkout FETCH_HEAD
        else
          echo "No matching livetemplate/docs branch for $DOCS_REF; using default branch"
        fi

    - name: Checkout client library
      uses: actions/checkout@v4
      with:
        repository: livetemplate/client
        path: livetemplate/client

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: livetemplate/client/package-lock.json

    - name: Build client library
      working-directory: livetemplate/client
      run: |
        echo "Installing client dependencies..."
        npm ci
        echo "Building client library..."
        npm run build
        echo "OK: Client library built successfully"
        ls -la dist/

    - name: Add replace directives to docs (parent module)
      working-directory: docs
      run: |
        echo "Adding replace directives to docs..."
        go mod edit -replace=github.com/livetemplate/livetemplate=../livetemplate
        go mod edit -replace=github.com/livetemplate/lvt=../lvt
        go mod tidy
        echo "OK: Replace directives added"

    - name: Add replace directives to docs/e2e (separate module)
      working-directory: docs/e2e
      run: |
        echo "Adding replace directives to docs/e2e..."
        go mod edit -replace=github.com/livetemplate/livetemplate=../../livetemplate
        go mod edit -replace=github.com/livetemplate/lvt=../../lvt
        go mod edit -replace=github.com/livetemplate/docs=../
        go mod tidy
        echo "OK: Replace directives added"

    - name: Run patterns e2e against core
      working-directory: docs/e2e/patterns
      # Submit_With_No_Changes is a pre-existing flash-state flake that
      # fails identically in upstream examples/patterns; tracked as a
      # follow-up to fix in the patterns app's flash handling.
      run: go test -v -count=1 -timeout=15m -skip "Submit_With_No_Changes" ./...
      env:
        CGO_ENABLED: 1
        LVT_LOCAL_CLIENT: ${{ github.workspace }}/livetemplate/client/dist/livetemplate-client.browser.js

  test-docs-todos:
    name: Test Docs Todos against Core Changes
    runs-on: ubuntu-latest

    steps:
    - name: Checkout core library (this PR/branch)
      uses: actions/checkout@v4
