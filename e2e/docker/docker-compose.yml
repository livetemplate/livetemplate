services:
  redis:
    image: redis:7-alpine
    ports:
      - "16399:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 5

  server-a:
    build:
      context: ../../
      dockerfile: e2e/docker/Dockerfile
    environment:
      - INSTANCE_ID=server-a
      - REDIS_URL=redis://redis:6379
      - PORT=8080
    ports:
      - "18091:8080"
    depends_on:
      redis:
        condition: service_healthy

  server-b:
    build:
      context: ../../
      dockerfile: e2e/docker/Dockerfile
    environment:
      - INSTANCE_ID=server-b
      - REDIS_URL=redis://redis:6379
      - PORT=8080
    ports:
      - "18092:8080"
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "18090:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server-a
      - server-b

  chrome:
    image: chromedp/headless-shell:latest
    ports:
      - "19222:9222"
    shm_size: 256m
