apiVersion: v1
kind: Service
metadata:
  name: livetemplate-app
  labels:
    app: livetemplate
    tier: application
spec:
  type: ClusterIP
  selector:
    app: livetemplate
    tier: application
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  sessionAffinity: None

---
# Headless service for StatefulSet (if needed for sticky sessions)
apiVersion: v1
kind: Service
metadata:
  name: livetemplate-app-headless
  labels:
    app: livetemplate
    tier: application
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: livetemplate
    tier: application
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
