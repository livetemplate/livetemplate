# Use sealed-secrets, external-secrets, or your cloud provider's secret manager

apiVersion: v1
kind: Secret
metadata:
  name: livetemplate-secrets
  labels:
    app: livetemplate
type: Opaque
stringData:
  # Database connection string
  # Replace with actual values and encode with base64 in production
  database_url: "postgres://appuser:CHANGEME@livetemplate-postgres:5432/appdb?sslmode=require"

  # Other sensitive configuration
  # api_key: "your-api-key"
  # jwt_secret: "your-jwt-secret"

